<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cardputer Dashboard</title>
<style>
body { background:#111; color:#0f0; font-family: monospace; padding: 20px; }
.card { border:1px solid #0f0; padding:15px; margin-bottom:15px; border-radius:6px; }
h1 { font-size: 18px; }
.val { font-size: 22px; font-weight:bold; }
</style>
</head>
<body>
<h1>Cardputer Status</h1>
<div class="card">Battery: <div class="val" id="battery">--</div></div>
<div class="card">WiFi: <div class="val" id="wifi">--</div></div>
<div class="card">Last RF Capture: <div class="val" id="capture">--</div></div>

<script>
async function update() {
    try {
        const res = await fetch('/dashboarddata');
        const data = await res.json();
        document.getElementById('battery').innerText = data.battery + '%';
        document.getElementById('wifi').innerText = data.wifi;
        document.getElementById('capture').innerText = data.lastCapture;
    } catch (e) {
        console.error(e);
    }
}
update();
setInterval(update, 1500);
</script>
</body>
</html>
